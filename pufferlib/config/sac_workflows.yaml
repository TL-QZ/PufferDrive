# @package _global_

max_runs: 4

sweep:
  method: Random
  metric: score
  goal: maximize
  downsample: 5
  train:
    learning_rate:
      distribution: log_normal
      min: 0.0001
      mean: 0.0003
      max: 0.001
      scale: auto
    critic_learning_rate:
      distribution: log_normal
      min: 0.0001
      mean: 0.0003
      max: 0.001
      scale: auto
    initial_alpha:
      distribution: log_normal
      min: 0.05
      mean: 0.2
      max: 0.5
      scale: auto
    tau:
      distribution: logit_normal
      min: 0.001
      mean: 0.005
      max: 0.02
      scale: auto
    replay_update_ratio:
      distribution: log_normal
      min: 0.05
      mean: 0.1
      max: 0.5
      scale: auto

controlled_exp:
  train:
    # Clear PPO grid entries inherited from puffer_drive.yaml after recursive merge.
    learning_rate: null
    ent_coef: null
    initial_alpha:
      values: [0.1, 0.2]
    tau:
      values: [0.005, 0.01]
    replay_update_ratio:
      values: [0.05, 0.1]

# SAC replay capacity defaults to 10,000; profile twice that many rows so the
# bounded run includes replay warmup and learner updates.
profile:
  total_timesteps: 20000

autotune:
  max_envs: 32
  model_forward_s: 0.0
  max_env_ram_gb: 16
  max_batch_vram_gb: 0.05
  time_per_test: 2
