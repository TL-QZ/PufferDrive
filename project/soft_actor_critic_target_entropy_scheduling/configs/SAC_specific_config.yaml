# SAC-specific learner and replay configuration
# Settings specific to this SAC route compared with the PPO route. Replay and
# target-network controls are also used by other off-policy algorithms.
# train.batch_size is included because here it means replay capacity, whereas
# PPO uses that name for its rollout batch. Shared gamma, actor learning_rate,
# minibatch_size, the base update_epochs and optimizer settings stay in SAC_tunable_config.yaml.
# This experiment retests selected round-three candidates with the Round 6
# PPO-scale per-rank replay capacity on two GPUs. Trial IDs 97 and 98 retain
# their round-three grid meanings while scheduling the target entropy.
# The selected trial IDs correspond to replay refresh ratios 0.1 and 0.5.
# Corresponding sweep/grid entries live here too; workflow controls stay tunable.
# Deep-merge SAC_fixed_config.yaml, SAC_tunable_config.yaml and this file.
# These are partial configs; the CLI does not automatically load them.


train:
  # Replay capacity per rank matches the PPO per-rank rollout batch: 20 * 3200 * 128.
  batch_size: 8192000
  # Fraction of replay replaced each evaluate cycle after initial fill; (0, 1]. Quota = ceil(batch_size * ratio), with FIFO eviction after a once-shuffled initial eviction order.
  replay_update_ratio: 0.1
  # Twin-critic optimizer learning rate; match PPO's non-swept model optimizer LR.
  critic_learning_rate: 0.0005
  # Temperature log-alpha Adam learning rate (>0); temperature always uses Adam.
  alpha_learning_rate: 0.0003
  # Initial entropy temperature (>0); subsequently learned automatically.
  initial_alpha: 0.1
  # Learn alpha while the target entropy is scheduled from its default maximum.
  learn_alpha: true
  # Initial target: 0.75 * log(12) nats, rounded to six decimal places.
  target_entropy: 1.863680
  target_entropy_schedule: adaptive
  target_entropy_ema_decay: 0.999
  target_entropy_mean_threshold: 0.01
  target_entropy_std_threshold: 0.05
  target_entropy_decay_factor: 0.9
  # Count qualifying updates cumulatively; this experiment requires one.
  target_entropy_required_count: 1
  # Target-critic Polyak coefficient in (0, 1]: target <- (1-tau)*target + tau*online after each learner update.
  tau: 0.005

sweep:
  train:
    gamma:
      distribution: categorical
      values: [0.95, 0.99, 0.999]
    target_entropy:
      distribution: categorical
      values: [0.621227, 1.242453, 1.863680]
    update_epochs:
      distribution: categorical
      values: [3, 15, 50, 100]
    replay_update_ratio:
      distribution: categorical
      values: [0.1, 0.5, 0.75]

controlled_exp:
  train:
    # Axis order is significant: each prior candidate gets 4 epoch x 3 replay settings.
    # The 3 * 3 * 4 * 3 grid has 108 combinations; launcher trial_ids selects 97 and 98.
    gamma:
      values: [0.95, 0.99, 0.999]
    target_entropy:
      values: [0.621227, 1.242453, 1.863680]
    update_epochs:
      values: [3, 15, 50, 100]
    replay_update_ratio:
      values: [0.1, 0.5, 0.75]
