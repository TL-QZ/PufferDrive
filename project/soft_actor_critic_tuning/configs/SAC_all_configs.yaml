# SAC configuration catalog — 2026-10-11
# Current repository defaults, consolidated into one YAML; NOT tuned values.
# Sources: pufferlib/config/{puffer_drive_sac,puffer_drive,sac_workflows}.yaml,
# pufferlib/config_schema.py, pufferlib/pufferl_sac.py and pufferlib/vector.py.
# No defaults/import chain: editing this file does not change package defaults.
# Existing CLI accepts dotted Hydra overrides, not this arbitrary filename.
# A future launcher can yaml.safe_load this file and pass the mapping to
# pufferlib.pufferl_sac.train(env_name="puffer_drive", args=config).
# Vector defaults describe 20 Drive instances, each with 1024 agent slots.
# DDP launch options (process count, rendezvous, LOCAL_RANK/WORLD_SIZE) belong
# to torchrun/the shell, not the YAML learner hyperparameters.
# PPO-only learner parameters are excluded by SAC's actual config loader.

# ============================================================================
# Identity, loading and logging
# ============================================================================
env_name: puffer_drive

# Drive environment package; current SAC startup supports ocean / puffer_drive.
package: ocean

# Required by current SAC startup: DriveSAC.
policy_name: DriveSAC

# Must remain null: recurrent SAC is not implemented.
rnn_name: null

# Run identifier used by logging and same-run checkpoint discovery. Use a unique name for each trial.
run_name: sac

# Actor-only warmstart: local .pt plus source config.yaml. Null starts a fresh actor; does not restore critics/optimizers.
load_model_path: null

# Remote actor artifact ID (W&B or Neptune); mutually exclusive with load_model_path and learner resume.
load_id: null

# Export command only: null writes <checkpoint_stem>_portable_actor beside the source. CLI: +export_path=/path.
export_path: null

# Enable W&B logging; if several logger flags are true, priority is Neptune, W&B, then TensorBoard.
wandb: false

wandb_project: pufferlib

wandb_group: debug

neptune: false

neptune_name: pufferai

neptune_project: ablations

# Enable local TensorBoard logging. With all logger flags false, the console/dashboard still runs.
tb: false

# Optional SAC/logger setting: disable remote model uploads, not local checkpoints. CLI: +no_model_upload=true.
no_model_upload: false

tag: null

# Inherited field; SAC derives distributed rank/device from torchrun environment variables, not this value.
local_rank: 0

# ============================================================================
# SAC learner, replay and execution
# ============================================================================
# All supported SAC learner/run keys. PPO GAE/clipping/value-loss/advantage-filter settings are intentionally absent.
train:
  # Torch/NumPy/Python seed; torchrun derives per-rank seeds. CLI default 42 (injected learner default is 0).
  seed: 42
  # Filename of the final model copy written into train.data_dir when training ends.
  final_model_name: final_model.pt
  # null disables scheduled benchmark evaluation; positive integer runs every N train cycles and at the end if needed.
  evaluation_interval_epochs: null
  # Benchmark names in eval.benchmark_config; comma-separated selections are supported.
  evaluation_benchmarks: carla_fast
  torch_deterministic: false
  # true stores replay on CPU (pinned for CUDA transfer); false stores it on the learner device.
  cpu_offload: true
  # cpu | cuda | cuda:N. torchrun sets the local CUDA device from LOCAL_RANK.
  device: cpu
  # adam | adamw | muon for actor/critics. Muon requires Heavyball; log-alpha stays Adam.
  optimizer: adam
  # Enable cosine schedules for actor and critic once per training cycle with updates; alpha learning rate is unchanged.
  anneal_lr: false
  # Autocast network forwards when true; SAC targets, probabilities, losses and temperature arithmetic remain FP32.
  amp: false
  # float32 (default) | bfloat16. bfloat16 requires amp=true; FP16 is not supported.
  precision: float32
  # Global received agent-row budget across ranks; vector batches can overshoot. Not a learner-update count.
  total_timesteps: 1000000
  # Actor optimizer learning rate (>0).
  learning_rate: 0.0003
  # Bootstrap discount in [0, 1]. Applied during collection; true terminal transitions use zero.
  gamma: 0.99
  # Positive integer: shuffled passes over the currently stored replay per train() call.
  update_epochs: 1
  # null disables clipping; positive value clips actor/critic gradients once per logical update.
  max_grad_norm: null
  # Optimizer moment coefficients in [0, 1); passed to Adam/AdamW and Heavyball Muon.
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  # Adam/AdamW actor/critic weight decay; not forwarded to Muon or applied to log-alpha.
  adam_weight_decay: 0.0
  # Run output/checkpoint directory. Current default preserved; select an experiment-specific directory before launching tuning.
  data_dir: experiments/puffer_drive_sac
  # Explicit learner checkpoint: restores networks/optimizers/temperature/counters/RNG. Environment and replay restart; cannot combine with actor warmstart.
  resume_state_path: null
  # Positive integer training-cycle interval, not received steps; also saves at the end.
  checkpoint_interval: 50
  # Total replay capacity in complete transitions per rank. Positive integer or auto=max(learning_starts, received agent batch, minibatch_size).
  batch_size: 10000
  # Transitions per logical learner update. Positive integer or auto=min(256, explicit replay capacity), otherwise 256.
  minibatch_size: 256
  # Maximum rows per forward/backward microbatch; gradients accumulate to one logical minibatch update.
  max_minibatch_size: 256
  # Compile actor and online/target critics with torch.compile; false uses eager execution.
  compile: false
  # torch.compile mode, e.g. default | reduce-overhead | max-autotune | max-autotune-no-cudagraphs. CUDA modes not runtime-verified here.
  compile_mode: default
  compile_fullgraph: false
  # Minimum replay entries for learning; 0 < learning_starts <= batch_size. Distributed learning waits until every rank has full replay.
  learning_starts: 10000
  # Fraction of replay replaced each evaluate cycle after initial fill; (0, 1]. Quota = ceil(batch_size * ratio), with distinct random old entries replaced.
  replay_update_ratio: 0.1
  # Twin-critic optimizer learning rate (>0).
  critic_learning_rate: 0.0003
  # Temperature log-alpha Adam learning rate (>0); temperature always uses Adam.
  alpha_learning_rate: 0.0003
  # Initial entropy temperature (>0); subsequently learned automatically.
  initial_alpha: 0.2
  # null = 0.98 * log(K), in nats, where K is the number of action classes. Explicit value must be in [0, log(K)].
  target_entropy: null
  # Target-critic Polyak coefficient in (0, 1]: target <- (1-tau)*target + tau*online after each learner update.
  tau: 0.005
  # true disables automatic trainer_state.pt discovery only. Independent trials still need a unique data_dir (and run_name), since outputs are written there.
  fresh_run: false

# ============================================================================
# Actor and twin-Q architecture
# ============================================================================
# Actor and each Q network have independent backbones; settings below are shared architecture choices, not shared parameters.
policy:
  # Encoder layer (per-encoder embedding width)
  ego_input_size: 128
  partner_input_size: 256
  lane_input_size: 256
  boundary_input_size: 256
  traffic_control_input_size: 128
  context_input_size: 128
  # Encoder activation - options: "relu", "tanh", "gelu"
  encoder_activation: relu
  encoder_layer_norm: true
  # true excludes padded objects from max pooling; false uses the existing unmasked encoder pooling.
  mask_padded_features: false
  # Backbone architecture used independently by actor, Q1 and Q2.
  backbone_hidden_size: 1024
  backbone_num_layers: 3
  # Backbone activation - options: "relu", "tanh", "gelu"
  backbone_activation: gelu
  backbone_layer_norm: false
  # Actor head layer
  actor_hidden_size: 256
  actor_num_layers: 1
  actor_head_layer_norm: false
  # Critic head layer
  critic_hidden_size: 256
  critic_num_layers: 1
  critic_head_layer_norm: false
  # Must remain false: actor and twin critics own separate parameters.
  shared_network: false
  # Must remain discrete for SAC (jerk: 12 action classes; classic: 63). env.action_type remains continuous.
  action_type: discrete

# Inherited compatibility fields only. Ignored while rnn_name=null; do not sweep these.
rnn:
  input_size: 512
  hidden_size: 512

# ============================================================================
# Vector collection
# ============================================================================
vec:
  # Serial | Multiprocessing. Other vector backends exist but are not verified by the SAC integration checks.
  backend: Multiprocessing
  # Number of Drive instances per rank; each instance has env.num_agents slots.
  num_envs: 20
  # Positive integer or auto (= num_envs). num_envs must be divisible by num_workers.
  num_workers: auto
  # Environment instances received together, NOT replay transitions. auto = num_envs // 2 (1 for one env); null = num_envs. Must align with environments per worker.
  batch_size: auto
  zero_copy: true
  # Environment seed; rank-specific seeds are derived under torchrun. Separate from train.seed.
  seed: 42
  # Multiprocessing receive order: true waits for workers in order; false polls for ready workers. CLI addition: +vec.sync_traj=false.
  sync_traj: true
  # Multiprocessing constructor default; true permits more workers than physical CPU cores. CLI: +vec.overwork=true.
  overwork: false

# ============================================================================
# Drive simulation, rewards and observations
# ============================================================================
env:
  # --- Simulation ---
  # Options: "gigaflow", "replay"
  simulation_mode: gigaflow
  # Agent slots per Drive instance (not the total across vec.num_envs or distributed ranks).
  num_agents: 1024
  # GIGAFLOW-specific: minimum/maximum number of agents per environment
  min_agents_per_env: 1
  max_agents_per_env: 120
  # Must remain continuous for current Drive SAC: native Drive discrete uses unsupported MultiDiscrete. SAC policy.action_type stays discrete and decodes each class to two controls.
  action_type: continuous
  # Dynamics model - options: "classic", "jerk"
  dynamics_model: jerk
  # Jerk dynamics: Zero both accelerations when velocity crosses zero
  reset_accel_on_stop: false
  # Time delta between steps in seconds
  dt: 0.3
  resample_replay_to_dt: false
  # Schema default shown; SAC training/autotune force true to bootstrap truncations from pre-reset observations.
  capture_final_observations: false
  # Optional nonzero launch speed for gigaflow random spawns
  spawn_initial_speed: 0.0
  # Collision behavior - options: "ignore", "stop", "remove"
  collision_behavior: stop
  # Offroad behavior - options: "ignore", "stop", "remove"
  offroad_behavior: stop
  # Traffic light behavior - options: "ignore", "stop", "remove"
  traffic_light_behavior: stop
  # Share static map geometry (roads/grid/lane-graph) across envs using the same map - 0 off, 1 on
  use_map_cache: 1
  # Precompute neighboring road entities for observation queries - 0 off, 1 on
  use_neighbor_cache: 1
  # Number of steps before reset
  scenario_length: 2560
  # Frequency of resampling scenario (in steps), 0 to disable
  resample_frequency: 256000
  # End of episode - options: 0 - scenario_length, 1 - early reset when too many agents are removed
  termination_mode: 1
  # Ratio of inactive agents (stopped/removed) that triggers early reset (used when termination_mode = 1)
  inactive_agent_threshold: 0.4
  # End the episode as soon as the agent reaches its final goal. Only active in
  # control_sdc_only replay mode (single active agent).
  terminate_on_goal: 0
  # Determines which step of the trajectory to initialize the agents at upon reset
  init_step: 0
  # allows to initiate the C environment at random init points - works in replay mode only:
  init_step_spread: false
  # sets an upper bound on the random init step
  # the sampled init step can be at most this close to the end of the episode;
  init_step_min_horizon: 20
  # Schema choices: control_vehicles | control_agents | control_wosac | control_sdc_only.
  control_mode: control_vehicles
  # Controller used by agent 0, the canonical SDC/target.
  # options: "static", "policy", "replay", "idm"
  sdc_controller: policy
  # Controller used by non-SDC vehicles.
  # options: "static", "policy", "replay", "idm"
  non_sdc_controller: policy
  # Controller used by non-vehicle agents. "auto" follows non_sdc_controller unless it is "idm", then it uses "replay".
  # options: "auto", "static", "policy", "replay", "idm"
  non_vehicle_controller: auto
  # create_all_valid | create_only_controlled.
  init_mode: create_all_valid
  # Enable computation of evaluation-only metrics
  compute_eval_metrics: false
  # finite | rolling. finite consumes the configured goal sequence; rolling replenishes the goal window.
  goal_regen_mode: finite
  # Schema choices: route | map | gt. Suitability depends on simulation mode and available trajectories.
  goal_source: map
  # Append normalized lane-graph distance to the current goal lane on each lane obs row
  obs_goal_lane_distance: true
  # Meters around goal to be considered "reached"
  goal_radius: 2.0
  # Maximum speed at final waypoint to count goal reward
  goal_speed: 3.0
  # Number of target waypoints in the observation (including goal)
  num_goals: 3
  # Waypoint spacing range in meters when building path
  min_goal_spacing: 20.0
  max_goal_spacing: 200.0
  # --- Rewards ---
  reward_conditioning: true
  # Requires reward_conditioning=true. Episode reward coefficients vary rather than remaining at the listed fixed coefficients.
  reward_randomization: true
  reward_log_sampling: false
  reward_goal: 1.0
  reward_collision: 1.5
  reward_offroad: 1.5
  reward_stop_line: 1.0
  reward_comfort: 0.05
  reward_lane_align: 0.025
  reward_vel_align: 1.0
  reward_lane_center: 0.001
  reward_center_bias: 0.0
  reward_velocity: 0.0025
  reward_reverse: 0.005
  reward_timestep: 2.5e-05
  reward_overspeed: 0.05
  reward_ade: 0.0
  # --- Map ---
  # Path to map used for training
  map_dir: pufferlib/resources/drive/binaries/carla
  # Number of maps to load from map_dir
  num_maps: 8
  # --- Observation slot counts ---
  obs_slots_lane_n: 70
  obs_slots_boundary_n: 50
  obs_slots_partners_n: 16
  obs_slots_traffic_controls_n: 4
  # Fraction of segment observation slots to drop (reduces obs size)
  obs_dropout_lane: 0.3
  obs_dropout_boundary: 0.4
  # Stride for lane and boundary segments; 1 means use every segment, 2 means use every other segment, etc.
  obs_lane_stride: 2
  obs_boundary_stride: 1
  # --- Observation normalization ---
  obs_norm_goal_offset_m: 200.0
  obs_norm_xy_offset_m: 200.0
  obs_norm_veh_length_m: 10.0
  obs_norm_veh_width_m: 5.0
  obs_norm_road_seg_length_m: 10.0
  obs_norm_road_seg_width_m: 5.0
  obs_norm_z_m: 10.0
  # --- Eval-only ---
  eval_perceived_size_margin_m: 0.1
  # --- Observation ranges (meters, ego frame) ---
  obs_range_road_front_m: 200.0
  obs_range_road_behind_m: 60.0
  obs_range_road_side_m: 50.0
  obs_range_partner_m: 200.0
  obs_range_traffic_control_m: 200.0
  # Per-episode probability of selecting a partner-blindness agent; these scripted/erratic slots are excluded using the environment mask.
  partner_blindness_prob: 0.02
  # Per-step probability that a flagged blind-partner agent zeros out its partner observations
  partner_blindness_trigger_prob: 0.03
  # Duration in seconds of partner blindness once triggered
  partner_blindness_duration_seconds: 3.0
  # Per-episode probability that an agent is flagged as a phantom braker for the whole episode
  phantom_braking_prob: 0.02
  # Per-step probability that a flagged phantom-braker actually initiates a brake window
  phantom_braking_trigger_prob: 0.03
  # Duration in seconds of phantom braking once triggered
  phantom_braking_duration_seconds: 3.0

# ============================================================================
# Evaluation and replay rendering
# ============================================================================
# Standalone and scheduled benchmark controls. Benchmark catalog overrides training env settings for evaluation.
eval:
  num_agents: 128
  # Worker cap for replay benchmarks that control only the SDC. Needed for now to limit RAM usage.
  max_sdc_replay_workers: 4
  benchmark_config: pufferlib/config/evaluation/benchmark.yaml
  # null uses the catalog selection behavior; supply benchmark name(s) for explicit standalone evaluation.
  benchmarks: null
  output_name: null
  # Results folder inside the run dir; also names the wandb key prefix final_<output_dir_name>_.
  output_dir_name: eval
  # Capture and render every scenario during the standard benchmark pass.
  render_scenarios: false
  # Render scenarios where any configured metric is positive.
  # Use all_infractions for every infraction type; null disables it.
  render_filter: null
  # Maximum failures rendered per benchmark; null renders every failure.
  max_rendered_failures: null
  # Existing episode metrics CSV to replay without running the benchmark first.
  failure_replay_csv: null
  capture_observations: false
  observation_replay_wave_size: 16
  observation_replay_writer_count: 4
  # sample | mode | mean. mode chooses argmax; mean decodes the probability-weighted physical action (not necessarily one discrete class).
  action_selection: mean

# ============================================================================
# Sweeps, controlled experiments and performance tools
# ============================================================================
# Maximum trials for sweep. controlled_exp instead runs the Cartesian product of its values lists.
max_runs: 4

# Single-process workflow; these are example search spaces, not tuned SAC recommendations. May also add env/policy parameter spaces.
sweep:
  # Searcher class from pufferlib.sweep: Random | ParetoGenetic | Protein | Carbs. Only Random has a real SAC sweep smoke; others may need dependencies/config.
  # Numeric spaces: distribution, min, mean, max, scale. scale=auto uses the space default.
  # Distributions: uniform | int_uniform | uniform_pow2 | log_normal | logit_normal.
  # Categorical spaces instead use distribution=categorical, values=[...], optional mean/scale.
  method: Random
  # Environment metric name (without environment/ prefix); must appear in training logs.
  metric: score
  goal: maximize
  downsample: 5
  train:
    learning_rate:
      distribution: log_normal
      min: 0.0001
      mean: 0.0003
      max: 0.001
      scale: auto
    critic_learning_rate:
      distribution: log_normal
      min: 0.0001
      mean: 0.0003
      max: 0.001
      scale: auto
    initial_alpha:
      distribution: log_normal
      min: 0.05
      mean: 0.2
      max: 0.5
      scale: auto
    tau:
      distribution: logit_normal
      min: 0.001
      mean: 0.005
      max: 0.02
      scale: auto
    replay_update_ratio:
      distribution: log_normal
      min: 0.05
      mean: 0.1
      max: 0.5
      scale: auto

# Single-process Cartesian grid. Null learning_rate/ent_coef entries only clear inherited PPO grid axes; they are not learner settings.
controlled_exp:
  train:
    # Clear PPO grid entries inherited from puffer_drive.yaml after recursive merge.
    learning_rate: null
    ent_coef: null
    initial_alpha:
      values:
      - 0.1
      - 0.2
    tau:
      values:
      - 0.005
      - 0.01
    replay_update_ratio:
      values:
      - 0.05
      - 0.1

# Single-process profiling workflow. Budget must reach replay warmup to include learner work.
profile:
  total_timesteps: 20000

# Single-process environment throughput utility; not a hyperparameter optimizer.
autotune:
  max_envs: 32
  # Estimated policy forward time in seconds per batch.
  model_forward_s: 0.0
  # Total environment RAM budget in GB; caps environment count using measured RAM per environment.
  max_env_ram_gb: 16
  # Observation-batch VRAM budget in GB; compared with estimated observation bytes (not full model/replay usage).
  max_batch_vram_gb: 0.05
  # Seconds to sample each candidate.
  time_per_test: 2

# ============================================================================
# Inherited compatibility fields (not SAC learner hyperparameters)
# ============================================================================
# Inherited from the PPO config; not a SAC training hyperparameter. Use eval.* for SAC benchmark/replay rendering.
render_mode: auto

# Inherited from the PPO config; not a SAC training hyperparameter. Use eval.* for SAC benchmark/replay rendering.
video_path: videos

# Overwritten by the selected benchmark catalog entry; change that entry in eval.benchmark_config to change scenario count.
num_scenarios: 3

# Inherited from the PPO config; not a SAC training hyperparameter. Use eval.* for SAC benchmark/replay rendering.
render: 0

# Inherited from the PPO config; not a SAC training hyperparameter. Use eval.* for SAC benchmark/replay rendering.
agent_index: null

# Inherited from the PPO config; not a SAC training hyperparameter. Use eval.* for SAC benchmark/replay rendering.
save_frames: 0

# Inherited from the PPO config; not a SAC training hyperparameter. Use eval.* for SAC benchmark/replay rendering.
gif_path: eval.gif

# Inherited from the PPO config; not a SAC training hyperparameter. Use eval.* for SAC benchmark/replay rendering.
fps: 15

# Inherited from the PPO config; not a SAC training hyperparameter. Use eval.* for SAC benchmark/replay rendering.
eval_simulation: null

# Inherited PPO field; SAC sweep does not pass this value into the searcher constructor.
max_suggestion_cost: 3600

# ============================================================================
# Lower-level Drive options (not fields of the current Hydra DriveEnvConfig)
# ============================================================================
# These constructor defaults are listed for completeness, not activated above.
# Adding them under env via the existing Hydra loader fails its structured schema.
# A direct Python args mapping can pass them, but evaluation owns the replay/planning
# fields below and may override them. Source: pufferlib/ocean/drive/drive.py:Drive.__init__.
# Optional env fields:
#   report_interval: 1           # Environment metric report interval, in steps.
#   traffic_control_scope: 0     # 0=lights, 1=lights+stop signs, 2=lights+stop+yield (constants.h).
#   starting_map: 0              # Initial map offset.
#   render_mode: null            # env.render_mode: environment renderer, distinct from root render_mode.
#   width: 1280                  # Renderer width in pixels.
#   height: 1024                 # Renderer height in pixels.
#   human_agent_idx: 0           # Agent followed by the interactive renderer.
#   shared_network: true         # Stored legacy attribute, unused by DriveSAC; distinct from policy.shared_network=false.
# Evaluation-managed constructor fields:
#   capture_replay: false
#   replay_worker_idx: 0
#   eval_mode: 0
#   num_eval_scenarios: 16
#   max_scenarios_per_batch: null
#   eval_map_indices: null
#   eval_scenario_seeds: null
# Internal plumbing: buf=null is vector-owned; constructor seed=1 is replaced by
# vec.seed/rank seeding in normal SAC startup. Neither belongs in a tuning grid.
# Derived learner values (not independent knobs): action_count comes from the
# action grid; train.run_name is filled from root run_name; rank/world size come
# from torchrun. Updates per epoch = ceil(replay occupancy / minibatch_size).
