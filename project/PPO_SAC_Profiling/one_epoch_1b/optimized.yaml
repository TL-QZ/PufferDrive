# One epoch, one-third FIFO refresh, no filtering; 1B global received steps.
source_config: project/PPO_SAC_Profiling/one_epoch_1b/source_sac.yaml
algorithm: sac
device: cuda
num_envs: 20
agents: 3200
replay_capacity: 2048000
logical_batch: 128000
microbatch: 32000
update_epochs: 1
compile: 'on'
return_estimator: pql
pql_horizon: 128
pql_lambda: 0.95
variant: fixed_targets_actor_q
replay_location: gpu
sac_filter_score: none
sac_filter_mode: fraction
sac_keep_fraction: 1.0
total_agent_steps: 1000000000
cycles: 10000
warmup: 1
seed: 0
save_learner_state: 'on'
snapshot_interval_cycles: 25
