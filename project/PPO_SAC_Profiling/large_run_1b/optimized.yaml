# Per-rank geometry. Budget is global received simulator agent rows.
source_config: project/PPO_SAC_Profiling/large_run_1b/source_sac.yaml
algorithm: sac
device: cuda
num_envs: 20
agents: 3200
replay_capacity: 2048000
logical_batch: 128000
microbatch: 32000
update_epochs: 3
compile: "on"
return_estimator: pql
pql_horizon: 128
pql_lambda: 0.95
variant: fixed_targets_actor_q
replay_location: gpu
sac_filter_score: target_advantage
sac_filter_mode: ewma_threshold
sac_filter_ewma_beta: 0.25
sac_filter_threshold_scale: 0.01
sac_keep_fraction: 1.0
total_agent_steps: 1000000000
cycles: 10000
warmup: 1
seed: 0
save_learner_state: "on"
snapshot_interval_cycles: 25
