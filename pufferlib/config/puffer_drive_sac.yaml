defaults:
  - puffer_drive
  - sac_workflows
  - _self_

# Keep Drive's environment, policy architecture, vectorization, and eval settings.
# SAC startup constructs DriveSAC and DriveSACCritic directly.
policy_name: DriveSAC
rnn_name: null
run_name: sac

train:
  seed: 42
  device: cpu
  torch_deterministic: false
  # Keep FP32 as the baseline; set amp=true and precision=bfloat16 for autocast.
  amp: false
  precision: float32
  compile: false
  compile_mode: default
  compile_fullgraph: false
  # Store replay on CPU by default; CUDA learners use pinned batches for async copies.
  cpu_offload: true
  total_timesteps: 1000000
  gamma: 0.99
  # Set batch_size=auto to use max(vecenv.agents_per_batch, minibatch_size).
  batch_size: 10000
  # Set minibatch_size=auto to use min(256, explicit capacity), or 256 when both sizes are auto.
  minibatch_size: 256
  max_minibatch_size: 256
  update_epochs: 1
  replay_update_ratio: 0.1
  learning_rate: 0.0003
  critic_learning_rate: 0.0003
  alpha_learning_rate: 0.0003
  optimizer: adam
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_eps: 1.0e-08
  adam_weight_decay: 0.0
  max_grad_norm: null
  initial_alpha: 0.2
  # Disable temperature updates to keep initial_alpha fixed.
  learn_alpha: true
  target_entropy: null
  # Adaptive scheduling is opt-in; null required_count resolves from the rank-local update batch.
  target_entropy_schedule: constant
  target_entropy_ema_decay: 0.999
  target_entropy_mean_threshold: 0.01
  target_entropy_std_threshold: 0.05
  target_entropy_decay_factor: 0.9
  target_entropy_required_count: null
  # Optional deadline for one forced decay, measured in global received agent rows.
  target_entropy_force_decay_steps: null
  tau: 0.005
  # Cosine-decay actor, critic, and (when learn_alpha=true) alpha learning rates.
  anneal_lr: false
  checkpoint_interval: 50
  final_model_name: final_model.pt
  resume_state_path: null
  # Skip same-directory trainer_state.pt autodiscovery; an explicit resume_state_path still loads.
  fresh_run: false
  # Null disables scheduled benchmark evaluation during SAC training.
  evaluation_interval_epochs: null
  # Selected benchmarks must exist in eval.benchmark_config.
  evaluation_benchmarks: carla_fast
  data_dir: experiments/puffer_drive_sac
