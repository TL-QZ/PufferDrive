# PPO schedule: 10B total timesteps; hand off after 2B.
# SAC continues for 2B steps with fixed alpha initialized at 0.1.
# Edit the two budgets in warm_start below.

warm_start:
  handoff_steps: 2000000000
  sac_steps: 2000000000
  run_dir: null
  run_name: null
_shared:
  env:
    action_type: continuous
    capture_final_observations: true
    collision_behavior: stop
    compute_eval_metrics: false
    control_mode: control_vehicles
    dt: 0.3
    dynamics_model: jerk
    eval_perceived_size_margin_m: 0.1
    goal_radius: 2.0
    goal_regen_mode: finite
    goal_source: map
    goal_speed: 3.0
    inactive_agent_threshold: 0.4
    init_mode: create_all_valid
    init_step: 0
    init_step_min_horizon: 20
    init_step_spread: false
    map_dir: pufferlib/resources/drive/binaries/carla
    max_agents_per_env: 120
    max_goal_spacing: 200.0
    min_agents_per_env: 1
    min_goal_spacing: 20.0
    non_sdc_controller: policy
    non_vehicle_controller: auto
    num_agents: 3200
    num_goals: 3
    num_maps: 8
    obs_boundary_stride: 1
    obs_dropout_boundary: 0.4
    obs_dropout_lane: 0.3
    obs_goal_lane_distance: true
    obs_lane_stride: 2
    obs_norm_goal_offset_m: 200.0
    obs_norm_road_seg_length_m: 10.0
    obs_norm_road_seg_width_m: 5.0
    obs_norm_veh_length_m: 10.0
    obs_norm_veh_width_m: 5.0
    obs_norm_xy_offset_m: 200.0
    obs_norm_z_m: 10.0
    obs_range_partner_m: 200.0
    obs_range_road_behind_m: 60.0
    obs_range_road_front_m: 200.0
    obs_range_road_side_m: 50.0
    obs_range_traffic_control_m: 200.0
    obs_slots_boundary_n: 50
    obs_slots_lane_n: 70
    obs_slots_partners_n: 16
    obs_slots_traffic_controls_n: 4
    offroad_behavior: stop
    partner_blindness_duration_seconds: 3.0
    partner_blindness_prob: 0.02
    partner_blindness_trigger_prob: 0.03
    phantom_braking_duration_seconds: 3.0
    phantom_braking_prob: 0.02
    phantom_braking_trigger_prob: 0.03
    resample_frequency: 256000
    resample_replay_to_dt: false
    reset_accel_on_stop: false
    reward_ade: 0.0
    reward_center_bias: 0.0
    reward_collision: 1.5
    reward_comfort: 0.05
    reward_conditioning: true
    reward_goal: 1.0
    reward_lane_align: 0.025
    reward_lane_center: 0.001
    reward_log_sampling: false
    reward_offroad: 1.5
    reward_overspeed: 0.05
    reward_randomization: true
    reward_reverse: 0.005
    reward_stop_line: 1.0
    reward_timestep: 2.5e-05
    reward_vel_align: 1.0
    reward_velocity: 0.0025
    scenario_length: 2560
    sdc_controller: policy
    simulation_mode: gigaflow
    spawn_initial_speed: 0.0
    terminate_on_goal: 0
    termination_mode: 1
    traffic_light_behavior: stop
    use_map_cache: 1
    use_neighbor_cache: 1
  policy:
    action_type: discrete
    actor_head_layer_norm: false
    actor_hidden_size: 256
    actor_num_layers: 1
    backbone_activation: gelu
    backbone_hidden_size: 1024
    backbone_layer_norm: false
    backbone_num_layers: 3
    boundary_input_size: 256
    context_input_size: 128
    critic_head_layer_norm: false
    critic_hidden_size: 256
    critic_num_layers: 1
    ego_input_size: 128
    encoder_activation: relu
    encoder_layer_norm: true
    lane_input_size: 256
    mask_padded_features: false
    partner_input_size: 256
    shared_network: false
    traffic_control_input_size: 128
ppo:
  agent_index: null
  no_model_upload: false
  env: ${_shared.env}
  env_name: puffer_drive
  eval:
    action_selection: mean
    benchmark_config: project/baseline_run_sync_2026-08-24/override_config/evaluation_benchmarks.yaml
    benchmarks: null
    capture_observations: false
    failure_replay_csv: null
    max_rendered_failures: null
    max_sdc_replay_workers: 4
    num_agents: 128
    observation_replay_wave_size: 16
    observation_replay_writer_count: 4
    output_dir_name: eval
    output_name: null
    render_filter: null
    render_scenarios: false
  eval_simulation: null
  fps: 15
  gif_path: eval.gif
  load_id: null
  load_model_path: null
  local_rank: 0
  max_runs: 200
  max_suggestion_cost: 3600
  neptune: false
  neptune_name: pufferai
  neptune_project: ablations
  num_scenarios: 3
  package: ocean
  policy: ${_shared.policy}
  policy_name: Drive
  render: 0
  render_mode: auto
  rnn:
    hidden_size: 512
    input_size: 512
  rnn_name: null
  run_name: ${warm_start.run_name}
  save_frames: 0
  tag: null
  tb: false
  train:
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    adam_weight_decay: 0.01
    adv_filter_enabled: true
    adv_filter_ewma_beta: 0.25
    adv_filter_threshold_scale: 0.01
    adv_sampling_prio_alpha: 0.8499999999999999
    adv_sampling_prio_beta0: 0.8499999999999999
    amp: true
    anneal_lr: true
    batch_size: auto
    bptt_horizon: 128
    checkpoint_interval: 500
    clip_coef: 0.2
    compile: true
    compile_fullgraph: false
    compile_mode: default
    cpu_offload: false
    data_dir: ${warm_start.run_dir}/ppo
    device: cuda
    ent_coef: 0.01
    evaluation_benchmarks: carla_fast
    evaluation_interval_epochs: 100
    final_model_name: final_model.pt
    gae_lambda: 0.95
    gamma: 0.999
    learning_rate: 0.0005
    max_grad_norm: 0.5
    max_minibatch_size: 32000
    min_batch_size: null
    minibatch_size: 128000
    name: pufferai
    normalize_rewards: false
    obs_only: true
    optimizer: adamw
    precision: bfloat16
    project: ablations
    render: false
    render_interval: 1000
    render_map: none
    resume_state_path: null
    seed: 0
    show_grid: false
    show_human_logs: true
    show_lasers: false
    torch_deterministic: false
    total_timesteps: 10000000000
    update_epochs: 3
    use_rnn: false
    use_value_bootstrapping: true
    vf_clip_coef: null
    vf_coef: 0.5
    vtrace_c_clip: 1
    vtrace_rho_clip: 1
  vec:
    backend: Multiprocessing
    batch_size: 10
    num_envs: 20
    num_workers: auto
    seed: 42
    zero_copy: true
  video_path: videos
  wandb: true
  wandb_group: sac_ppo_warm_start
  wandb_project: pufferdrive
sac:
  agent_index: null
  env: ${_shared.env}
  env_name: puffer_drive
  eval:
    action_selection: mean
    benchmark_config: project/baseline_run_sync_2026-08-24/override_config/evaluation_benchmarks.yaml
    benchmarks: null
    capture_observations: false
    failure_replay_csv: null
    max_rendered_failures: null
    max_sdc_replay_workers: 4
    num_agents: 128
    observation_replay_wave_size: 16
    observation_replay_writer_count: 4
    output_dir_name: eval
    output_name: null
    render_filter: null
    render_scenarios: false
  eval_simulation: null
  export_path: null
  fps: 15
  gif_path: eval.gif
  load_id: null
  load_model_path: null
  local_rank: 0
  max_runs: 4
  max_suggestion_cost: 3600
  neptune: false
  neptune_name: pufferai
  neptune_project: ablations
  no_model_upload: false
  num_scenarios: 3
  package: ocean
  policy: ${_shared.policy}
  policy_name: DriveSAC
  render: 0
  render_mode: auto
  rnn:
    hidden_size: 512
    input_size: 512
  rnn_name: null
  run_name: ${warm_start.run_name}
  save_frames: 0
  tag: null
  tb: false
  train:
    adam_beta1: 0.9
    adam_beta2: 0.999
    adam_eps: 1.0e-08
    adam_weight_decay: 0.01
    alpha_learning_rate: 0.0003
    amp: true
    anneal_lr: false
    batch_size: 8192000
    checkpoint_interval: null
    compile: true
    compile_fullgraph: false
    compile_mode: default
    cpu_offload: true
    critic_learning_rate: 0.0005
    data_dir: ${warm_start.run_dir}/sac
    device: cuda
    evaluation_benchmarks: carla_fast
    evaluation_interval_epochs: 1
    final_model_name: final_model.pt
    fresh_run: true
    gamma: 0.999
    initial_alpha: 0.1
    learn_alpha: false
    learning_rate: 0.0005
    max_grad_norm: 0.5
    max_minibatch_size: 32000
    minibatch_size: 128000
    optimizer: adamw
    precision: bfloat16
    replay_update_ratio: 0.1
    resume_state_path: null
    seed: 0
    target_entropy: 1.86368
    tau: 0.005
    torch_deterministic: false
    total_timesteps: ${warm_start.sac_steps}
    update_epochs: 3
  vec:
    backend: Multiprocessing
    batch_size: 10
    num_envs: 20
    num_workers: auto
    overwork: false
    seed: 42
    zero_copy: true
  video_path: videos
  wandb: true
  wandb_group: sac_ppo_warm_start
  wandb_project: pufferdrive
provenance:
